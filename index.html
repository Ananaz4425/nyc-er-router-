<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- ✅ FIXED viewport -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>NeuroRoute — Emergency Dispatch</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
:root {
  --bg:#040b14;
  --panel:#070f1a;
  --panel2:#0a1525;
  --border:#0f2236;
  --border2:#1a3a5c;
  --cyan:#00d4ff;
  --red:#ff2d55;
  --green:#00ff88;
  --yellow:#ffd60a;
  --text:#c8dff0;
  --text2:#5a8aaa;
}

/* RESET */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

/* ✅ FIXED overflow */
html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:sans-serif;
  overflow:auto;
}

/* ✅ FIXED height */
#app{
  display:grid;
  grid-template-columns:320px 1fr 300px;
  grid-template-rows:60px 1fr;
  min-height:100vh;
}

/* TOP BAR */
#topbar{
  grid-column:1/-1;
  background:var(--panel);
  display:flex;
  align-items:center;
  padding:10px;
}

/* PANELS */
#left{background:var(--panel);}
#right{background:var(--panel);}

/* MAP */
#map{
  width:100%;
  height:100%;
}

/* MOBILE */
@media (max-width:768px){

  #app{
    grid-template-columns:1fr;
    grid-template-rows:auto auto 350px auto;
  }

  #map{
    height:350px; /* ✅ improved */
  }

}
</style>
</head>

<body>

<div id="app">

  <div id="topbar">
    🚑 NeuroRoute
  </div>

  <div id="left">
    LEFT PANEL
  </div>

  <div id="map"></div>

  <div id="right">
    RIGHT PANEL
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// MAP INIT
const map = L.map('map').setView([40.7831,-73.9712],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// ✅ FIX: map rendering on mobile
setTimeout(()=>{
  map.invalidateSize();
},300);

window.addEventListener('resize',()=>{
  map.invalidateSize();
});

</script>

</body>
</html>
